<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bücherliste</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>
  <h1>Bücherliste</h1>
  <p id="available-count"></p>

  <ul id="book-list"></ul>

  <form id="book-form">
    <input id="title-input" placeholder="Titel">
    <input id="author-input" name="author" placeholder="Autor oder Autorin">
    <button>Hinzufügen</button>
  </form>
  <p id="error-message" class="error"></p>
</body>
</html>
